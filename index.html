<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="img/flycobot-icon.png" type="image/png">
<title>FLYCOBOT</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f4f7fb; color: #172033;
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form {
    width: min(420px, calc(100% - 32px));
    background: #fff; border: 1px solid #d7e0ea; border-radius: 16px;
    box-shadow: 0 8px 24px rgba(23, 32, 51, .06);
    padding: 28px;
  }
  .brand { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  img { width: 48px; height: 48px; border-radius: 22%; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
  p { margin: 2px 0 0; color: #5c6b80; font-size: 14px; }
  label { display: block; margin: 18px 0 8px; font-weight: 650; }
  input {
    width: 100%; border: 1px solid #d7e0ea; border-radius: 10px;
    padding: 12px 14px; font: inherit; color: inherit; background: #fff;
    -webkit-text-security: disc;
  }
  button {
    margin-top: 16px; width: 100%; border: 0; border-radius: 10px;
    background: #1258D8; color: #fff; font: inherit; font-weight: 650;
    padding: 12px 14px; cursor: pointer;
  }
  button:disabled { opacity: .7; cursor: wait; }
  .err { min-height: 1.4em; margin: 12px 0 0; color: #9a3b32; font-size: 14px; }
</style>
</head>
<body>
<form id="gate">
  <div class="brand">
    <img src="img/flycobot-icon.png" alt="">
    <div>
      <h1>FLYCOBOT</h1>
      <p id="lockline">Not defteri kilitli</p>
    </div>
  </div>
  <div id="ask">
    <label for="pass">Şifre</label>
    <input id="pass" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="go" required>
    <button id="open" type="submit">Aç</button>
  </div>
  <p class="err" id="err" role="status"></p>
</form>
<script>
const pass = document.getElementById("pass");
pass.addEventListener("input", () => {
  const digits = pass.value.replace(/\D/g, "");
  if (pass.value !== digits) pass.value = digits;
});
const form = document.getElementById("gate");
const err = document.getElementById("err");
const button = document.getElementById("open");

function mime(path) {
  const ext = path.split(".").pop().toLowerCase();
  if (ext === "jpg" || ext === "jpeg") return "image/jpeg";
  if (ext === "png") return "image/png";
  if (ext === "webp") return "image/webp";
  if (ext === "gif") return "image/gif";
  return "application/octet-stream";
}

function unpack(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let offset = 0;
  const htmlLen = view.getUint32(offset); offset += 4;
  const htmlBytes = bytes.subarray(offset, offset + htmlLen); offset += htmlLen;
  let html = new TextDecoder().decode(htmlBytes);
  const count = view.getUint32(offset); offset += 4;
  const files = [];
  for (let i = 0; i < count; i++) {
    const nameLen = view.getUint16(offset); offset += 2;
    const name = new TextDecoder().decode(bytes.subarray(offset, offset + nameLen)); offset += nameLen;
    const dataLen = view.getUint32(offset); offset += 4;
    const data = bytes.subarray(offset, offset + dataLen); offset += dataLen;
    const blob = new Blob([data], { type: mime(name) });
    files.push([name, URL.createObjectURL(blob)]);
  }
  files.sort((a, b) => b[0].length - a[0].length);
  for (const [name, url] of files) html = html.split(name).join(url);
  return html;
}

const sessionKey = "flycobot-open";
function readSession() {
  try { return sessionStorage.getItem(sessionKey) || ""; } catch (e) { return ""; }
}
function writeSession(value) {
  try { sessionStorage.setItem(sessionKey, value); } catch (e) {}
}
function clearSession() {
  try { sessionStorage.removeItem(sessionKey); } catch (e) {}
}

function showLock() {
  document.getElementById("lockline").textContent = "Not defteri kilitli";
  document.getElementById("ask").hidden = false;
  button.disabled = false;
  button.textContent = "Aç";
}

async function openNotes(password) {
  const response = await fetch("notes.bin?v=" + Date.now(), { cache: "no-store" });
  if (!response.ok) throw new Error("Dosya açılmadı");
  const packed = new Uint8Array(await response.arrayBuffer());
  if (new TextDecoder().decode(packed.subarray(0, 4)) !== "FCB1") throw new Error("Dosya bozuk");
  const view = new DataView(packed.buffer, packed.byteOffset, packed.byteLength);
  const iterations = view.getUint32(4);
  const salt = packed.subarray(8, 24);
  const iv = packed.subarray(24, 36);
  const ciphertext = packed.subarray(36);
  const baseKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const plain = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext));
  writeSession(password);
  const notebook = unpack(plain);
  const courseEntry = "  document.body.dataset.course = id;";
  const offlineExport = '    let html = "<!DOCTYPE html>\\n" + document.documentElement.outerHTML;';
  const html = notebook.includes("function setupCoursePanel(") || !notebook.includes(courseEntry)
    ? notebook
    : notebook
      .replace("</style>", () => "  .course-layout {\n    display: grid; grid-template-columns: minmax(190px, 240px) minmax(0, 1fr);\n    align-items: start; gap: 18px;\n  }\n  .course-nav {\n    position: sticky; top: var(--course-top); max-height: calc(100dvh - var(--course-top) - 12px);\n    overflow: auto; background: var(--panel); border: 1px solid var(--line);\n    border-radius: 16px; padding: 12px;\n  }\n  .course-nav input, .course-nav button {\n    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;\n    padding: 6px 8px; font-size: 13px;\n  }\n  .course-nav input { width: 100%; }\n  .course-nav button { cursor: pointer; margin: 8px 4px 0 0; }\n  .course-nav ol { display: grid; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }\n  .course-nav a {\n    display: block; padding: 8px 10px; border: 1px solid var(--line);\n    border-radius: 8px; background: var(--bg); color: var(--ink);\n    text-decoration: none; overflow-wrap: anywhere;\n  }\n  .course-nav a:hover, .course-nav a[aria-current=\"location\"] { border-color: var(--teal); }\n  .course-nav a[aria-current=\"location\"] { box-shadow: inset 3px 0 var(--teal); }\n  .course-nav a.has-match { background: #fff0b3; border-color: #b68514; }\n  .course-nav a:focus-visible { outline: 2px solid var(--teal); outline-offset: -3px; }\n  .course-nav [role=\"status\"] { display: block; font-size: 13px; color: var(--muted); }\n  .course-content .note { scroll-margin-top: var(--course-top); }\n  .course-content .note:first-child { margin-top: 0; }\n  details.note summary .note-match-title { color: inherit; font: inherit; }\n  mark[data-note-match] { background: #ffdf79; color: var(--ink); }\n  @media (max-width: 720px) {\n    .course-layout { grid-template-columns: minmax(0, 1fr); }\n    .course-nav { position: static; max-height: none; }\n    .course-nav ol { max-height: 12rem; overflow: auto; }\n  }\n" + "</style>")
      .replace("function openCourse(id) {", () => "const coursePanels = new WeakSet();\nconst header = document.querySelector(\"header\");\nnew ResizeObserver(() => {\n  document.documentElement.style.setProperty(\"--course-top\", header.offsetHeight + 12 + \"px\");\n}).observe(header);\n\nfunction clearNoteMarks(root) {\n  for (const mark of root.querySelectorAll(\"mark[data-note-match]\")) {\n    const parent = mark.parentNode;\n    mark.replaceWith(...mark.childNodes);\n    parent.normalize();\n  }\n  for (const title of root.querySelectorAll(\".note-match-title\")) {\n    title.replaceWith(...title.childNodes);\n  }\n}\n\nfunction highlightNote(root, pattern) {\n  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);\n  const nodes = [];\n  while (walker.nextNode()) nodes.push(walker.currentNode);\n  let found = false;\n  for (const node of nodes) {\n    const matches = [...node.data.matchAll(pattern)];\n    if (matches.length && node.parentElement.matches(\"summary\")) {\n      const title = document.createElement(\"span\");\n      title.className = \"note-match-title\";\n      node.replaceWith(title);\n      title.append(node);\n    }\n    for (const match of matches.reverse()) {\n      const text = node.splitText(match.index);\n      text.splitText(match[0].length);\n      const mark = document.createElement(\"mark\");\n      mark.dataset.noteMatch = \"\";\n      text.replaceWith(mark);\n      mark.append(text);\n      found = true;\n    }\n  }\n  return found;\n}\n\nfunction setupCoursePanel(course) {\n  if (!course || coursePanels.has(course)) return;\n  const notes = [...course.querySelectorAll(\":scope > details.note\")];\n  if (!notes.length) return;\n  coursePanels.add(course);\n\n  const layout = document.createElement(\"div\");\n  layout.className = \"course-layout\";\n  const nav = document.createElement(\"nav\");\n  nav.className = \"course-nav\";\n  nav.setAttribute(\"aria-label\", \"Eğitim bölümleri\");\n  nav.innerHTML = '\u003cinput type=\"search\" aria-label=\"Eğitim içinde ara\" placeholder=\"Eğitim içinde ara\">' +\n    '\u003cbutton type=\"button\">Tümünü aç\u003c/button>\u003cbutton type=\"button\">Tümünü kapat\u003c/button>' +\n    '\u003cspan role=\"status\">\u003c/span>\u003col>\u003c/ol>';\n  const input = nav.querySelector(\"input\");\n  const [expand, collapse] = nav.querySelectorAll(\"button\");\n  const status = nav.querySelector(\"[role=status]\");\n  const list = nav.querySelector(\"ol\");\n  const content = document.createElement(\"div\");\n  content.className = \"course-content\";\n  notes[0].before(layout);\n  layout.append(nav, content);\n  content.append(...notes);\n\n  const links = notes.map((note, index) => {\n    const summary = note.querySelector(\"summary\");\n    const item = document.createElement(\"li\");\n    const link = document.createElement(\"a\");\n    link.href = \"#\" + course.id + \"-note-\" + (index + 1);\n    note.id = link.hash.slice(1);\n    link.textContent = summary.textContent.trim();\n    link.addEventListener(\"click\", event => {\n      event.preventDefault();\n      nav.querySelector(\"[aria-current]\")?.removeAttribute(\"aria-current\");\n      link.setAttribute(\"aria-current\", \"location\");\n      note.open = true;\n      summary.focus({ preventScroll: true });\n      note.scrollIntoView({ block: \"start\" });\n    });\n    item.append(link);\n    list.append(item);\n    return link;\n  });\n\n  let previousOpen;\n  function setAll(open) {\n    notes.forEach(note => { note.open = open; });\n    if (previousOpen) previousOpen = notes.map(() => open);\n  }\n  expand.addEventListener(\"click\", () => setAll(true));\n  collapse.addEventListener(\"click\", () => setAll(false));\n  input.addEventListener(\"input\", () => {\n    const query = input.value.trim();\n    clearNoteMarks(layout);\n    if (query && !previousOpen) previousOpen = notes.map(note => note.open);\n    const escaped = query.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\").replace(/[iIİı]/g, \"[iIİı]\");\n    const pattern = new RegExp(escaped, \"giu\");\n    let count = 0;\n    notes.forEach((note, index) => {\n      const match = query && highlightNote(note, pattern);\n      links[index].classList.toggle(\"has-match\", Boolean(match));\n      if (match) {\n        highlightNote(links[index], pattern);\n        count++;\n      }\n      if (previousOpen) note.open = query ? Boolean(match) : previousOpen[index];\n    });\n    if (!query) previousOpen = undefined;\n    status.textContent = query ? (count ? count + \" bölümde eşleşme\" : \"Eşleşme bulunamadı\") : \"\";\n  });\n}\n\n" + "function openCourse(id) {")
      .replace(courseEntry, () => "  setupCoursePanel(document.getElementById(id));\n" + courseEntry)
      .replace(offlineExport, () => "    const snapshot = document.documentElement.cloneNode(true);\n    clearNoteMarks(snapshot);\n    for (const layout of snapshot.querySelectorAll(\".course-layout\")) {\n      layout.replaceWith(...layout.querySelector(\".course-content\").children);\n    }\n    let html = \"\u003c!DOCTYPE html>\\n\" + snapshot.outerHTML;\n".trimEnd());
  document.open();
  document.write(html);
  document.close();
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  err.textContent = "";
  button.disabled = true;
  button.textContent = "Açılıyor";
  try {
    await openNotes(pass.value);
  } catch (error) {
    clearSession();
    showLock();
    err.textContent = error && error.name === "OperationError" ? "Şifre yanlış." : "Notlar açılamadı.";
  }
});

const saved = readSession();
if (saved) {
  document.getElementById("lockline").textContent = "Güncel notlar açılıyor";
  document.getElementById("ask").hidden = true;
  openNotes(saved).catch(() => {
    clearSession();
    err.textContent = "Notlar açılamadı.";
    showLock();
  });
}
</script>
</body>
</html>
